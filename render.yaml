services:
  - type: web
    name: colabverse
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_ALLOWED_HOSTS
        value: colabverse.onrender.com,colabverse.name.ng

      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://colabverse.onrender.com,https://colabverse.name.ng

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: GITHUB_APP_ID
        sync: false

      - key: GITHUB_APP_PRIVATE_KEY
        sync: false

      - key: GITHUB_CLIENT_ID
        sync: false

      - key: GITHUB_CLIENT_SECRET
        sync: false

      - key: GITHUB_OAUTH_CALLBACK_URL
        value: https://colabverse.name.ng/github/callback/

      - key: CODEVIEW_GOOGLE_CLIENT_ID
        sync: false

      - key: CODEVIEW_GOOGLE_CLIENT_SECRET
        sync: false

      - key: LIVEKIT_URL
        sync: false

      - key: LIVEKIT_API_KEY
        sync: false

      - key: LIVEKIT_API_SECRET
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: CODEVIEW_EMAIL_FROM
        value: "ColabVerse <noreply@mail.colabverse.name.ng>"